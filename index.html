<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a33">
<title>Конвейер Сити</title>
<style>
  :root { --panel: rgba(18, 26, 32, 0.82); --text: #f1f5f2; --dim: #9fb2b0; --accent: #ffd23f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a33; overscroll-behavior: none; touch-action: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); -webkit-user-select: none; user-select: none; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); background: var(--panel); border-radius: 12px; padding: 10px 14px; max-width: min(340px, calc(100vw - 24px)); }
  .small { font-size: 12px; }
  .dim { color: var(--dim); }
  .info { margin-top: 6px; font-size: 14px; }
  .buttons { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
  button { touch-action: manipulation; pointer-events: auto; min-width: 48px; min-height: 48px; border: 0; border-radius: 12px; background: var(--panel); color: var(--text); font-size: 22px; cursor: pointer; }
  button:active { background: #2e4350; }
  .newmap { position: absolute; left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom)); font-size: 14px; padding: 0 16px; }
</style>
</head>
<body>
<div id="game"></div>
<script src="game.js?v=84e189dc"></script>
</body>
</html>
