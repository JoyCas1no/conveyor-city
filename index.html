<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1b2a33">
<title>Конвейер Сити</title>
<style>
  :root { --panel: rgba(18, 26, 32, 0.86); --text: #f1f5f2; --dim: #9fb2b0; --accent: #ffd23f; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b2a33; overscroll-behavior: none; touch-action: none; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--text); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: fixed; inset: 0; touch-action: none; }
  #game canvas { display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); background: var(--panel); border-radius: 12px; padding: 10px 14px; max-width: min(340px, calc(100vw - 90px)); }
  .small { font-size: 12px; }
  .dim { color: var(--dim); }
  .info { margin-top: 6px; font-size: 14px; }
  .stock { margin-top: 6px; font-size: 13px; color: var(--accent); }
  .stock:empty { display: none; }
  .power { margin-top: 4px; font-size: 13px; color: #9fe3a0; }
  .power:empty { display: none; }
  .power.bad { color: #ff8a80; font-weight: 600; }
  button { touch-action: manipulation; pointer-events: auto; border: 0; color: var(--text); font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .link { background: none; padding: 6px 0; color: #8fd3ff; text-decoration: underline; font-size: 12px; min-height: 32px; }
  .zoom { position: absolute; right: max(12px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; }
  .zoom button { min-width: 48px; min-height: 48px; border-radius: 12px; background: var(--panel); font-size: 22px; }
  .bar { position: absolute; left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); bottom: max(8px, env(safe-area-inset-bottom)); display: flex; gap: 6px; justify-content: center; }
  .tool { flex: 1 1 0; max-width: 78px; min-width: 44px; min-height: 58px; border-radius: 12px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 4px 2px; border: 2px solid transparent; }
  .tool .ico { font-size: 22px; line-height: 1; }
  .tool .lbl { font-size: 10px; color: var(--dim); }
  .tool.on { border-color: var(--accent); background: rgba(70, 60, 20, 0.92); }
  .tool.on .lbl { color: var(--text); }
  .tool:active { background: #2e4350; }
  .toast { position: absolute; left: 50%; bottom: calc(max(8px, env(safe-area-inset-bottom)) + 70px); transform: translateX(-50%); background: var(--panel); padding: 8px 14px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity 0.2s; max-width: calc(100vw - 32px); text-align: center; }
  .toast.bad { background: rgba(150, 30, 30, 0.92); }
  .toast.show { opacity: 1; }
  .sheet { position: absolute; left: max(8px, env(safe-area-inset-left)); right: max(8px, env(safe-area-inset-right)); bottom: calc(max(8px, env(safe-area-inset-bottom)) + 70px); background: var(--panel); border-radius: 14px; padding: 10px; pointer-events: auto; z-index: 4; max-width: 520px; margin: 0 auto; }
  .sheet[hidden] { display: none; }
  .sheet-title { font-size: 12px; color: var(--dim); margin: 0 4px 8px; }
  .sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pal { min-height: 76px; border-radius: 10px; background: rgba(255, 255, 255, 0.08); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; border: 2px solid transparent; }
  .pal .ico { font-size: 24px; line-height: 1; }
  .pal .nm { font-size: 13px; font-weight: 600; }
  .pal .cost { font-size: 10px; color: var(--dim); text-align: center; line-height: 1.25; }
  .pal.on { border-color: var(--accent); background: rgba(70, 60, 20, 0.92); }
  .pal.off { opacity: 0.45; }
  .pal:active { background: #2e4350; }
  .tool.open { background: #2e4350; }
  .pal-open .zoom { display: none; }
  .toast { z-index: 6; }
</style>
</head>
<body>
<div id="game"></div>
<script src="game.js?v=6a41db04"></script>
</body>
</html>
